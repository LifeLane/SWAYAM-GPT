name: Android CI

on:
  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android_check:
    name: Android Quality Check
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"


      - name: Check Gradle Setup
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi


      - name: Run Android Lint
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew lint --no-daemon
          else
            gradle lint --no-daemon
          fi


      - name: Run Unit Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew test --no-daemon
          else
            gradle test --no-daemon
          fi


      - name: Verify Debug Build
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
