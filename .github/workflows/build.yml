name: Build & Release Automation

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_android:
    name: Build APK & AAB
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT PROJECT
      # =========================================================

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0


      # =========================================================
      # 2. JAVA
      # =========================================================

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle


      # =========================================================
      # 3. SETUP GRADLE
      # =========================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"


      # =========================================================
      # 4. CHECK GRADLE
      # =========================================================

      - name: Check Gradle Setup
        run: |
          echo "Checking Gradle installation..."

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
            ./gradlew --version
          else
            echo "Gradle wrapper not found."
            echo "Using installed Gradle instead."
            gradle --version
          fi


      # =========================================================
      # 5. CREATE RELEASE SIGNING KEY
      # =========================================================

      - name: Setup Release Keystore
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          echo "Preparing Android release signing key..."

          if [ -z "$STORE_PASSWORD" ]; then
            echo "ERROR: STORE_PASSWORD secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD secret is missing."
            exit 1
          fi

          if [ ! -f "my-upload-key.jks" ]; then

            echo "Creating release signing key..."

            keytool -genkeypair \
              -v \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=SWAYAM-GPT Upload Key,O=LifeLane,C=IN"

          fi

          echo "Release signing key is ready."


      # =========================================================
      # 6. BUILD DEBUG APK
      # =========================================================

      - name: Build Debug APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi


      # =========================================================
      # 7. BUILD RELEASE APK
      # =========================================================

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          if [ -f "./gradlew" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi


      # =========================================================
      # 8. BUILD RELEASE AAB
      # =========================================================

      - name: Build Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

        run: |

          if [ -f "./gradlew" ]; then
            ./gradlew bundleRelease --no-daemon
          else
            gradle bundleRelease --no-daemon
          fi


      # =========================================================
      # 9. SHOW OUTPUTS
      # =========================================================

      - name: Show Build Outputs
        if: always()

        run: |

          echo ""
          echo "=========================================="
          echo "APK FILES"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print 2>/dev/null || true

          echo ""
          echo "=========================================="
          echo "AAB FILES"
          echo "=========================================="

          find app/build/outputs/bundle \
            -type f \
            -name "*.aab" \
            -print 2>/dev/null || true


      # =========================================================
      # 10. UPLOAD APK
      # =========================================================

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: swayam-gpt-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error


      # =========================================================
      # 11. UPLOAD AAB
      # =========================================================

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: swayam-gpt-aab
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: error


      # =========================================================
      # 12. CLEAN SIGNING KEY
      # =========================================================

      - name: Clean Signing Key
        if: always()

        run: |
          rm -f my-upload-key.jks
